<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="إرث - ERTH | منصة التراث الليبي">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ERTH">
  <link rel="apple-touch-icon" href="assets/assets/logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/assets/logo.png"/>

  <title>إرث | ERTH</title>
  <meta name="theme-color" content="#8B261D">
  <link rel="manifest" href="manifest.json">
  <script>
    // PWA install support: capture the install prompt for the Flutter UI.
    window.deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.deferredPrompt = e;
    });
    window.addEventListener("appinstalled", function () {
      window.deferredPrompt = null;
    });
    window.erthCanInstall = function () { return !!window.deferredPrompt; };
    window.erthIsStandalone = function () {
      return window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
    };
    window.erthIsIOS = function () {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    };
    window.erthInstall = async function () {
      if (!window.deferredPrompt) return "unavailable";
      window.deferredPrompt.prompt();
      var choice = await window.deferredPrompt.userChoice;
      window.deferredPrompt = null;
      return choice.outcome;
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
