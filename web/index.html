  <script>
    // PWA install support: capture the install prompt for the Flutter UI.
    window.deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.deferredPrompt = e;
    });
    window.addEventListener("appinstalled", function () {
      window.deferredPrompt = null;
    });
    window.erthCanInstall = function () { return !!window.deferredPrompt; };
    window.erthIsStandalone = function () {
      return window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
    };
    window.erthIsIOS = function () {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    };
    // ── Guide voice: ElevenLabs (eleven_multilingual_v2) ──
    // NOTE: this key is public in the page source by the owner's choice;
    // restrict it in ElevenLabs (TTS only + character quota).
    (function () {
      var XI_KEY = "sk_fa20b1cef3d0ac4f63c5ebab155c3f2d75da6fbc18f7c944";
      var VOICES = { severus: "pNInz6obpgDQGcFmaJgB", medusa: "21m00Tcm4TlvDq8ikWAM" };
      var WELCOME_AR = {
        severus: { file: "audio/severus_welcome_ar.mp3", text: "أهلاً بك في رحاب إرث. أنا الإمبراطور سيبتيموس سيفيروس، ابن لبدة الكبرى. سلني عما شئت من أسرار العمارة وتاريخ الحضارات الليبية." },
        medusa: { file: "audio/medusa_welcome_ar.mp3", text: "مرحباً بك في عالم الجمال والتاريخ. أنا ميدوسا، حارسة الفنون وأسرار لبدة وقورينا. دعنا نستكشف معاً روائع الفسيفساء والآثار الخالدة." }
      };
      var SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

      var audio = window.__erthAudio = new Audio();
      audio.preload = "auto";
      audio.setAttribute("playsinline", "");
      window.__erthPlaying = false;
      window.__erthAudioCache = window.__erthAudioCache || {};
      var abort = null, token = 0, unlocked = false;

      // iOS Safari / Android Chrome: the element must first play inside a
      // user gesture; afterwards it may play later (e.g. when a reply arrives).
      function unlock() {
        if (unlocked) return;
        unlocked = true;
        try {
          audio.muted = true;
          audio.src = SILENT;
          var p = audio.play();
          var done = function () { audio.muted = false; };
          if (p && p.then) p.then(done, function () { done(); unlocked = false; }); else done();
        } catch (e) { unlocked = false; }
      }
      ["pointerdown", "touchstart", "touchend", "click"].forEach(function (ev) {
        document.addEventListener(ev, unlock, true);
      });

      function clean(text) {
        var s = String(text || "");
        try { s = s.replace(/\p{Extended_Pictographic}|️|‍/gu, " "); } catch (e) {}
        return s
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/https?:\/\/\S+/g, " ")
          .replace(/^\s*(?:[-*+•▪●◦]|\d+[.)])\s+/gm, "")
          .replace(/[*#_`~>|\[\]{}]+/g, " ")
          .replace(/\s+[-–—]\s+/g, "، ")
          .replace(/\s+/g, " ")
          .trim();
      }
      function stopped(tok) { if (tok === token) window.__erthPlaying = false; }

      function play(url, tok) {
        if (tok !== token) return;
        audio.onended = function () { stopped(tok); };
        audio.onerror = function () { stopped(tok); };
        audio.muted = false;
        audio.src = url;
        var p = audio.play();
        if (p && p.catch) p.catch(function () { stopped(tok); });
      }

      window.erthStopAudio = function () {
        token++;
        window.__erthPlaying = false;
        if (abort) { try { abort.abort(); } catch (e) {} abort = null; }
        try { audio.onended = null; audio.onerror = null; audio.pause(); } catch (e) {}
      };
      window.erthIsSpeaking = function () { return window.__erthPlaying; };

      // Returns true when playback (or the fetch for it) has started.
      window.erthSpeak = function (text, lang, persona) {
        unlock();
        window.erthStopAudio();
        var tok = token;
        persona = VOICES[persona] ? persona : "severus";
        lang = String(lang || "ar").slice(0, 2).toLowerCase();
        var s = clean(text);
        if (!s) return false;
        window.__erthPlaying = true;

        // 0 ms: pre-generated Arabic welcome.
        var w = WELCOME_AR[persona];
        if (lang === "ar" && s === clean(w.text)) { play(w.file, tok); return true; }

        var key = persona + ":" + lang + ":" + s;
        var cached = window.__erthAudioCache[key];
        if (cached) { play(cached, tok); return true; }

        abort = typeof AbortController !== "undefined" ? new AbortController() : null;
        fetch("https://api.elevenlabs.io/v1/text-to-speech/" + VOICES[persona] +
          "/stream?optimize_streaming_latency=3&output_format=mp3_44100_128", {
          method: "POST",
          headers: { "xi-api-key": XI_KEY, "Content-Type": "application/json", "Accept": "audio/mpeg" },
          body: JSON.stringify({
            text: s.slice(0, 2500),
            model_id: "eleven_multilingual_v2",
            voice_settings: { stability: 0.62, similarity_boost: 0.82 }
          }),
          signal: abort ? abort.signal : undefined
        }).then(function (r) {
          if (!r.ok) throw new Error("ElevenLabs HTTP " + r.status);
          return r.blob();
        }).then(function (blob) {
          var url = URL.createObjectURL(blob);
          window.__erthAudioCache[key] = url;
          play(url, tok);
        }).catch(function (e) {
          if (!(e && e.name === "AbortError")) console.warn("[ERTH] voice failed:", e);
          stopped(tok);
        });
        return true;
      };
    })();
    window.erthInstall = async function () {
      if (!window.deferredPrompt) return "unavailable";
      window.deferredPrompt.prompt();
      var choice = await window.deferredPrompt.userChoice;
      window.deferredPrompt = null;
      return choice.outcome;
    };
  </script>

<body>
  <!--
    Loading splash: visible immediately while main.dart.js and CanvasKit
    download (several MB). Without it, slow connections see a blank white
    page for tens of seconds. Removed on Flutter's first rendered frame.
  -->
  <style>
    #erth-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 35%,#2a0c10 0%,#100304 70%);color:#C59B27;font-family:Tahoma,Arial,sans-serif;z-index:9999;transition:opacity .4s ease}
    #erth-splash svg{width:112px;height:112px;display:block;filter:drop-shadow(0 0 14px rgba(197,155,39,.35))}
    #erth-splash .name{font-size:28px;letter-spacing:6px;color:#E6D7C3}
    #erth-splash .bar{width:140px;height:3px;border-radius:3px;background:rgba(197,155,39,.2);overflow:hidden}
    #erth-splash .bar i{display:block;width:40%;height:100%;background:#C59B27;animation:erth-load 1.2s ease-in-out infinite}
    #erth-splash .msg{font-size:13px;color:#A89885}
    @keyframes erth-load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  </style>
  <div id="erth-splash" dir="rtl">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="erthGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FAF2DC"/><stop offset=".45" stop-color="#DFB85C"/><stop offset="1" stop-color="#C59B27"/>
      </linearGradient></defs>
      <g fill="none" stroke="url(#erthGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8H94L88 18H12Z"/>
        <path d="M10 25Q16 24 16 32V84Q16 90 8 92H30Q24 90 24 84V32Q24 26 30 25"/>
        <path d="M90 25Q84 24 84 32V84Q84 90 92 92H70Q76 90 76 84V32Q76 26 70 25"/>
        <path d="M28 92V48A22 22 0 0 1 72 48V92"/>
        <path d="M37 92V48A13 13 0 0 1 63 48V92"/>
      </g>
    </svg>
    <div class="name">إرث · ERTH</div>
    <div class="bar"><i></i></div>
    <div class="msg">جارٍ تحميل منصة التراث الليبي…</div>
  </div>
  <script>
    // Drop any service worker / caches left by earlier builds: the old Flutter
    // SW kept serving a stale (broken) bundle, so the app never appeared.
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
    } catch (e) {}

    // Splash watchdog: fade out on Flutter's first frame (main() awaits the
    // Arabic fonts first, max 1.5s), or after 6s as a safety net.
    var erthSplashGone = false;
    function removeSplash() {
      if (erthSplashGone) return;
      erthSplashGone = true;
      var splash = document.getElementById('erth-splash');
      if (!splash) return;
      splash.style.opacity = '0';
      splash.style.pointerEvents = 'none';
      setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 400);
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    setTimeout(removeSplash, 6000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
