<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- No Referer on outgoing requests: the cloud TTS fallback (Google
       translate_tts) answers 404 when a third-party Referer is sent. -->
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="إرث - ERTH | منصة التراث الليبي">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ERTH">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=6">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=6"/>

  <title>إرث | ERTH</title>
  <meta name="theme-color" content="#100304">
  <!-- Primary Arabic font: fetched in parallel with the engine so Flutter
       finds it in the HTTP cache when main() preloads fonts. -->
  <link rel="preload" href="assets/assets/fonts/Tajawal-Regular.ttf" as="fetch" type="font/ttf" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/Tajawal-Bold.ttf" as="fetch" type="font/ttf" crossorigin="anonymous">
  <style>
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background-color:#100304;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  </style>
  <link rel="manifest" href="manifest.json?v=6">
  <script>
    // PWA install support: capture the install prompt for the Flutter UI.
    window.deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.deferredPrompt = e;
    });
    window.addEventListener("appinstalled", function () {
      window.deferredPrompt = null;
    });
    window.erthCanInstall = function () { return !!window.deferredPrompt; };
    window.erthIsStandalone = function () {
      return window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
    };
    window.erthIsIOS = function () {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    };
    // ── Live voice for the historical AI guides: 3-layer engine ──
    // A) native Web Speech  →  B) cloud TTS <audio> stream  →  C) Web Audio
    // chime feedback. Mobile browsers only allow audio that starts inside a
    // user gesture, so everything is unlocked on the first tap and the
    // same <audio> element / AudioContext / speechSynthesis are reused.
    (function () {
      var hasSS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
      var SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
      var BCP = { ar: "ar-SA", en: "en-GB", it: "it-IT", fr: "fr-FR", tr: "tr-TR", zh: "zh-CN", ru: "ru-RU", ja: "ja-JP" };
      var GTL = { zh: "zh-CN" };
      var PERSONA = {
        severus: { pitch: 0.85, rate: 0.95, cloudRate: 0.92, male: true },
        medusa: { pitch: 1.15, rate: 0.95, cloudRate: 1.04, male: false }
      };
      var audio = null, ctx = null, unlocked = false;
      var state = { active: false, token: 0 };
      var voices = [];

      function loadVoices() { try { voices = hasSS ? speechSynthesis.getVoices() || [] : []; } catch (e) { voices = []; } }
      if (hasSS) {
        loadVoices();
        try { speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch (e) { speechSynthesis.onvoiceschanged = loadVoices; }
      }

      // Must run synchronously inside a tap. Safe to call repeatedly.
      function unlock() {
        try {
          if (!audio) {
            audio = new Audio();
            audio.preload = "auto";
            audio.setAttribute("playsinline", "");
          }
          if (!unlocked) {
            audio.src = SILENT;
            var p = audio.play();
            if (p && p.catch) p.catch(function () {});
          }
        } catch (e) {}
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC && !ctx) ctx = new AC();
          if (ctx && ctx.state === "suspended") ctx.resume();
        } catch (e) {}
        try {
          if (hasSS && !unlocked) {
            var u = new SpeechSynthesisUtterance("");
            u.volume = 0;
            speechSynthesis.speak(u);
          }
        } catch (e) {}
        unlocked = true;
      }
      window.erthUnlockAudio = unlock;
      // Belt and braces: unlock on the very first touch anywhere on the page.
      ["pointerdown", "touchend", "click", "keydown"].forEach(function (ev) {
        document.addEventListener(ev, function once() {
          unlock();
          document.removeEventListener(ev, once, true);
        }, true);
      });

      // ── Layer C: Web Audio lyre chord and "speech starting" cue ──
      function pluck(freq, at, dur, gain, type) {
        if (!ctx) return;
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type || "triangle";
        o.frequency.setValueAtTime(freq, at);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(gain, at + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(at); o.stop(at + dur + 0.05);
      }
      window.erthChime = function (persona) {
        try {
          unlock();
          if (!ctx) return;
          var t = ctx.currentTime + 0.02;
          // Severus: D major lyre; Medusa: A major, an octave-bright voicing.
          var notes = persona === "medusa" ? [440, 554.37, 659.25, 880] : [146.83, 220, 293.66, 369.99];
          notes.forEach(function (f, i) {
            pluck(f, t + i * 0.085, 1.8, 0.09, "triangle");
            pluck(f * 2, t + i * 0.085, 0.9, 0.025, "sine");
          });
        } catch (e) {}
      };
      function cue(persona) {
        try {
          if (!ctx) return;
          var t = ctx.currentTime + 0.01;
          var base = persona === "medusa" ? 659.25 : 293.66;
          pluck(base, t, 0.35, 0.05, "sine");
          pluck(base * 1.5, t + 0.07, 0.4, 0.04, "sine");
        } catch (e) {}
      }

      function clean(text) {
        var s = String(text || "");
        try { s = s.replace(/\p{Extended_Pictographic}|️|‍/gu, " "); } catch (e) {}
        return s
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/https?:\/\/\S+/g, " ")
          .replace(/^\s*(?:[-*+•▪●◦]|\d+[.)])\s+/gm, "")
          .replace(/[*#_`~>|\[\]{}]+/g, " ")
          .replace(/\s+-\s+|\s+–\s+/g, "، ")
          .replace(/\s+/g, " ")
          .trim();
      }
      function chunks(s, max) {
        var parts = s.match(/[^.!?؟。！？،,;؛]+[.!?؟。！？،,;؛]*/g) || [s];
        var out = [], cur = "";
        parts.forEach(function (p) {
          p = p.trim();
          if (!p) return;
          while (p.length > max) { // split long sentences on spaces
            var cut = p.lastIndexOf(" ", max);
            if (cut < max * 0.5) cut = max;
            if (cur) { out.push(cur); cur = ""; }
            out.push(p.slice(0, cut).trim());
            p = p.slice(cut).trim();
          }
          if ((cur + " " + p).trim().length > max) { if (cur) out.push(cur); cur = p; }
          else cur = (cur + " " + p).trim();
        });
        if (cur) out.push(cur);
        return out;
      }
      function voiceFor(lang, male) {
        if (!voices.length) loadVoices();
        var base = lang.slice(0, 2).toLowerCase();
        var list = voices.filter(function (v) {
          return v.lang && v.lang.replace("_", "-").toLowerCase().indexOf(base) === 0;
        });
        if (!list.length) return null;
        var maleRx = /\bmale\b|\bman\b|david|daniel|george|james|mark|maged|tarik|naayf|hamed|shakir|luca|diego|cosimo|paul|henri|thomas|ahmet|yunyang|kangkang|pavel|dmitry|yuri|ichiro|keita|otoya/i;
        var femRx = /female|woman|zira|samantha|karen|susan|hazel|hoda|laila|salma|zariyah|amira|mariam|elsa|alice|isabella|julie|amelie|denise|filiz|emel|huihui|xiaoxiao|tingting|irina|svetlana|milena|kyoko|haruka|nanami|ayumi/i;
        for (var i = 0; i < list.length; i++) {
          var n = list[i].name || "";
          if (male ? (maleRx.test(n) && !/female/i.test(n)) : femRx.test(n)) return list[i];
        }
        return list[0];
      }
      function finish(tok) { if (tok === state.token) state.active = false; }

      // ── Layer B: cloud TTS audio stream, chunk by chunk ──
      function speakCloud(parts, lang, p, tok) {
        if (!audio) { finish(tok); return; }
        var tl = GTL[lang] || lang;
        var i = 0;
        function next() {
          if (tok !== state.token) return;
          if (i >= parts.length) { finish(tok); return; }
          var q = parts[i++];
          audio.onended = next;
          audio.onerror = function () { next(); };
          audio.src = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=" +
            encodeURIComponent(tl) + "&q=" + encodeURIComponent(q);
          audio.playbackRate = p.cloudRate;
          try { audio.preservesPitch = false; audio.webkitPreservesPitch = false; } catch (e) {}
          var pr = audio.play();
          if (pr && pr.catch) pr.catch(function () { finish(tok); });
        }
        next();
      }

      // ── Layer A: native Web Speech, with a 600ms start watchdog ──
      function speakNative(parts, lang, p, voice, tok) {
        var started = false;
        var bcp = voice ? voice.lang : (BCP[lang] || lang);
        try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch (e) {}
        try { speechSynthesis.resume(); } catch (e) {}
        parts.forEach(function (c, idx) {
          var u = new SpeechSynthesisUtterance(c);
          u.lang = bcp; u.voice = voice; u.pitch = p.pitch; u.rate = p.rate;
          u.onstart = function () { started = true; };
          if (idx === parts.length - 1) u.onend = function () { finish(tok); };
          u.onerror = function (ev) {
            if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return;
            if (!started && tok === state.token) { started = true; speakCloud(parts, lang, p, tok); }
            else if (idx === parts.length - 1) finish(tok);
          };
          speechSynthesis.speak(u);
        });
        setTimeout(function () {
          if (started || tok !== state.token) return;
          try { speechSynthesis.cancel(); } catch (e) {}
          started = true;
          speakCloud(parts, lang, p, tok);
        }, 600);
      }

      window.erthStopSpeak = function () {
        state.token++;
        state.active = false;
        try { if (hasSS) speechSynthesis.cancel(); } catch (e) {}
        try { if (audio) { audio.onended = null; audio.onerror = null; audio.pause(); } } catch (e) {}
      };
      window.erthIsSpeaking = function () { return state.active; };
      window.erthTtsSupported = function () { return hasSS || typeof Audio !== "undefined"; };

      // Public entry point. lang: app code (ar, en, it, fr, tr, zh, ru, ja);
      // persona: "severus" | "medusa". Call it straight from a tap handler.
      window.erthSpeak = function (text, lang, persona) {
        unlock();
        window.erthStopSpeak();
        var tok = state.token;
        var p = PERSONA[persona] || PERSONA.severus;
        lang = String(lang || "ar").slice(0, 2).toLowerCase();
        var s = clean(text);
        if (!s) return false;
        var parts = chunks(s, 180);
        state.active = true;
        cue(persona);
        var voice = hasSS ? voiceFor(lang, p.male) : null;
        if (hasSS && voice) speakNative(parts, lang, p, voice, tok);
        else speakCloud(parts, lang, p, tok);
        return true;
      };
    })();
    window.erthInstall = async function () {
      if (!window.deferredPrompt) return "unavailable";
      window.deferredPrompt.prompt();
      var choice = await window.deferredPrompt.userChoice;
      window.deferredPrompt = null;
      return choice.outcome;
    };
  </script>
</head>
<body>
  <!--
    Loading splash: visible immediately while main.dart.js and CanvasKit
    download (several MB). Without it, slow connections see a blank white
    page for tens of seconds. Removed on Flutter's first rendered frame.
  -->
  <style>
    #erth-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 35%,#2a0c10 0%,#100304 70%);color:#C59B27;font-family:Tahoma,Arial,sans-serif;z-index:9999;transition:opacity .4s ease}
    #erth-splash svg{width:112px;height:112px;display:block;filter:drop-shadow(0 0 14px rgba(197,155,39,.35))}
    #erth-splash .name{font-size:28px;letter-spacing:6px;color:#E6D7C3}
    #erth-splash .bar{width:140px;height:3px;border-radius:3px;background:rgba(197,155,39,.2);overflow:hidden}
    #erth-splash .bar i{display:block;width:40%;height:100%;background:#C59B27;animation:erth-load 1.2s ease-in-out infinite}
    #erth-splash .msg{font-size:13px;color:#A89885}
    @keyframes erth-load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  </style>
  <div id="erth-splash" dir="rtl">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="erthGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FAF2DC"/><stop offset=".45" stop-color="#DFB85C"/><stop offset="1" stop-color="#C59B27"/>
      </linearGradient></defs>
      <g fill="none" stroke="url(#erthGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8H94L88 18H12Z"/>
        <path d="M10 25Q16 24 16 32V84Q16 90 8 92H30Q24 90 24 84V32Q24 26 30 25"/>
        <path d="M90 25Q84 24 84 32V84Q84 90 92 92H70Q76 90 76 84V32Q76 26 70 25"/>
        <path d="M28 92V48A22 22 0 0 1 72 48V92"/>
        <path d="M37 92V48A13 13 0 0 1 63 48V92"/>
      </g>
    </svg>
    <div class="name">إرث · ERTH</div>
    <div class="bar"><i></i></div>
    <div class="msg">جارٍ تحميل منصة التراث الليبي…</div>
  </div>
  <script>
    // Drop any service worker / caches left by earlier builds: the old Flutter
    // SW kept serving a stale (broken) bundle, so the app never appeared.
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
    } catch (e) {}

    // Splash watchdog: fade out on Flutter's first frame (main() awaits the
    // Arabic fonts first, max 1.5s), or after 6s as a safety net.
    var erthSplashGone = false;
    function removeSplash() {
      if (erthSplashGone) return;
      erthSplashGone = true;
      var splash = document.getElementById('erth-splash');
      if (!splash) return;
      splash.style.opacity = '0';
      splash.style.pointerEvents = 'none';
      setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 400);
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    setTimeout(removeSplash, 6000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
