<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="إرث - ERTH | منصة التراث الليبي">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ERTH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=5">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=5"/>

  <title>إرث | ERTH</title>
  <meta name="theme-color" content="#8B261D">
  <link rel="manifest" href="manifest.json?v=5">
  <script>
    // PWA install support: capture the install prompt for the Flutter UI.
    window.deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.deferredPrompt = e;
    });
    window.addEventListener("appinstalled", function () {
      window.deferredPrompt = null;
    });
    window.erthCanInstall = function () { return !!window.deferredPrompt; };
    window.erthIsStandalone = function () {
      return window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
    };
    window.erthIsIOS = function () {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    };
    window.erthInstall = async function () {
      if (!window.deferredPrompt) return "unavailable";
      window.deferredPrompt.prompt();
      var choice = await window.deferredPrompt.userChoice;
      window.deferredPrompt = null;
      return choice.outcome;
    };
  </script>
</head>
<body style="margin:0;background:#100304;">
  <!--
    Loading splash: visible immediately while main.dart.js and CanvasKit
    download (several MB). Without it, slow connections see a blank white
    page for tens of seconds. Removed on Flutter's first rendered frame.
  -->
  <style>
    #erth-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 35%,#2a0c10 0%,#100304 70%);color:#C59B27;font-family:Tahoma,Arial,sans-serif;z-index:9999;transition:opacity .4s ease}
    #erth-splash img{width:96px;height:96px;object-fit:contain}
    #erth-splash .name{font-size:28px;letter-spacing:6px;color:#E6D7C3}
    #erth-splash .bar{width:140px;height:3px;border-radius:3px;background:rgba(197,155,39,.2);overflow:hidden}
    #erth-splash .bar i{display:block;width:40%;height:100%;background:#C59B27;animation:erth-load 1.2s ease-in-out infinite}
    #erth-splash .msg{font-size:13px;color:#A89885}
    @keyframes erth-load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  </style>
  <div id="erth-splash" dir="rtl">
    <img src="icons/Icon-192.png?v=5" alt="">
    <div class="name">إرث · ERTH</div>
    <div class="bar"><i></i></div>
    <div class="msg">جارٍ تحميل منصة التراث الليبي…</div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var s = document.getElementById("erth-splash");
      if (!s) return;
      s.style.opacity = "0";
      setTimeout(function () { s.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
